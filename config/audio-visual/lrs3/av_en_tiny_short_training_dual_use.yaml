train_name: whisper-release-test
audio_max_length: 320000 # 20s
text_max_length: 350 # 350
accelerator: auto
weight_decay: 0.01
adam_epsilon: 1.0e-8
num_worker: 16
validate_every_n_batches: 1000
num_devices: 1

model_name: tiny.en
learning_rate: 1.0e-4  
batch_size: 4 # 40s (2 * audio_max_length)
num_train_steps: 20000
warmup_steps: 2000
gradient_accumulation_steps: 2

monitor: 'val_noisy_en_babble/acc_av' # noisy test set
noise_prob: 1.0
noise_snr_train: 0
noise_fn: '//beegfs/data/shared/lrs3/noise/musan/tsv/all/train.tsv'
noise_fn_val: '//beegfs/data/shared/lrs3/noise/musan/tsv/babble/valid.tsv' # single lrs3 babble mixture
noise_fn_test: '//beegfs/data/shared/lrs3/noise/musan/tsv/babble/test.tsv' # single lrs3 babble mixture

video_model_ckpt: 'models/large_vox_iter5.pt' #'//beegfs/work_fast/shared/li_shared/models/large_noise_pt_noise_ft_433h_only_weights.pt' #'models/large_vox_iter5.pt'
freeze_video_model: False # train visual encoder
freeze_video_batch_norm_stats: False 

# lang: multi
lang: en-lrs3-433h

# mod drop: use av 0.5, a 0.0, v 0.5
prob_use_av: 1.0
prob_use_a: 0.0

pt_ckpt: /home/zhengyangli/work_fast/whisper-flamingo/models/checkpoint/whisper_lrs3_433h_tiny/step-90000-wer=0.0620-acc=0.9457.ckpt
train_id: whisper_tiny_short_training_lrs3_dual_use

spec_augment: ""
dropout_rate: 0 

resume_training: False
video_projection_train_only: False
video_projection_separate_lr: ''

# video
use_av_hubert_encoder: True # True means use avhubert, False means use resnet
av_hubert_path: '//beegfs/work_fast/zhengyangli/av_hubert/avhubert'
# fusion_mode: baseline | early_fusion | dual_use | dual_use_concat
fusion_mode: dual_use
# output_layer: 1-based AV-HuBERT encoder layer used as visual features (e.g. 12). Unset/null = use final layer.
output_layer: null
freeze_loaded_params: False

log_output_dir: "slurm/train_video_slurm"
check_output_dir: "models/checkpoint"


