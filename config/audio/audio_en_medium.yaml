train_name: whisper_medium_en_lrs3_433h_a6000
audio_max_length: 320000 # 20s
text_max_length: 350
accelerator: auto
weight_decay: 0.01
adam_epsilon: 1.0e-8
num_worker: 16
validate_every_n_batches: 1000
num_devices: 1

model_name: medium.en
learning_rate: 6.25e-6
batch_size: 8
num_train_steps: 90000
warmup_steps: 1000
gradient_accumulation_steps: 1

monitor: 'val_noisy_multi_babble/acc' # noisy test set
noise_prob: 1.0
noise_fn: '//beegfs/data/shared/lrs3/noise/musan/tsv/all/train.tsv'
noise_fn_val: '//beegfs/data/shared/lrs3/noise/musan/tsv/babble/valid.tsv' # single lrs3 babble mixture
noise_fn_test: '//beegfs/data/shared/lrs3/noise/musan/tsv/babble/test.tsv' # single lrs3 babble mixture

spec_augment: ""
dropout_rate: 0 

freeze_loaded_params: False

resume_training: false
# lang: multi # en, es, fr, it, pt
lang: en-lrs3-433h # en, ar, de, el, es, fr, it, pt, ru
train_id: whisper_en_medium_finetune_lrs3_433h

log_output_dir: "slurm/train_audio_slurm"
check_output_dir: "models/checkpoint"